name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,audit]"

      - name: Ruff lint
        run: python -m ruff check .

      - name: Ruff format check
        run: python -m ruff format --check .

      - name: Tests
        run: python -m pytest -q

      - name: Export Python 3.10 resolved inventory
        # This environment deliberately has no audit extra: its marker requires
        # Python >=3.11. Exclude only the editable project root; pip-audit
        # cannot resolve an editable local project, while all installed runtime
        # and test dependencies remain pinned in this inventory.
        if: matrix.python-version == '3.10'
        run: python -m pip freeze --all --exclude-editable > python310-resolved-requirements.txt

      - name: Upload Python 3.10 resolved inventory
        if: matrix.python-version == '3.10'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: python310-resolved-inventory
          path: python310-resolved-requirements.txt
          if-no-files-found: error

      - name: Dependency audit
        # pip-audit's CacheControl[filecache] chain selects vulnerable filelock
        # on Python 3.10; its patched release requires Python >=3.11. Runtime
        # and test coverage still run on 3.10; its exported inventory is audited
        # separately with the supported audit-tool Python version below.
        if: matrix.python-version != '3.10'
        run: python -m pip_audit

  audit-python310:
    name: Audit Python 3.10 resolved inventory
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Set up audit Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Download Python 3.10 resolved inventory
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: python310-resolved-inventory

      - name: Install audit tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pip-audit>=2.7.0"

      - name: Audit exact Python 3.10 pins
        # --no-deps prevents a second resolver from altering the exported pins.
        run: python -m pip_audit --no-deps --requirement python310-resolved-requirements.txt
