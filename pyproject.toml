[project]
name = "tiger-tradehub"
version = "0.1.0"
description = "Guarded Tiger Brokers trading bridge for ChatGPT, Claude, and Telegram."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Joncallim" }]
keywords = ["tiger-brokers", "trading", "mcp", "fastapi", "telegram"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Financial and Insurance Industry",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial :: Investment",
  "Typing :: Typed",
]
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "python-dotenv>=1.0.1",
  "tigeropen>=3.3.0",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2,<3.0"]
telegram = ["python-telegram-bot>=21.4"]
dev = [
  "build>=1.2.0",
  "mcp>=1.2,<3.0",
  "pip-audit>=2.7.0",
  "pytest>=8.2.0",
  "ruff==0.16.5",
  "setuptools>=83.0.0",
]

[project.urls]
Homepage = "https://github.com/Joncallim/tiger-tradehub"
Repository = "https://github.com/Joncallim/tiger-tradehub"
Issues = "https://github.com/Joncallim/tiger-tradehub/issues"

[project.scripts]
tradehub = "tradehub.app:main"
tradehub-mcp = "tradehub.mcp_server:main"
tradehub-telegram = "tradehub.telegram_bot:main"
tradehub-acceptance = "tradehub.acceptance.runner:main"
tradehub-research = "tradehub_research.cli:main"
research-validate = "tradehub_research.validation.cli:main"
tradehub-research-acceptance = "tradehub_research.acceptance.runner:main"
tradehub-research-mcp = "tradehub_research.mcp_server:main"
research-db = "tradehub_research.cli:main"

[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tradehub*", "tradehub_research*"]
exclude = ["tests*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
